name: Emulator Test (Play!)

on:
  push:
  pull_request:

jobs:
  build-headless:
    name: Build headless ELF
    runs-on: ubuntu-latest
    container: ghcr.io/ps2homebrew/ps2homebrew:main
    permissions:
      contents: read
    steps:
      - name: Install dependencies
        run: |
          set -eu
          if command -v apk >/dev/null 2>&1; then
            apk add --no-cache build-base git zip
          elif command -v apt-get >/dev/null 2>&1; then
            apt-get update
            apt-get install -y --no-install-recommends build-essential git zip
          else
            echo "Unsupported container package manager" >&2
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Build headless ELF
        run: make HEADLESS=1

      - name: Upload headless ELF artifact
        uses: actions/upload-artifact@v4
        with:
          name: PS2Ident-headless-${{ github.sha }}
          path: PS2Ident.elf

  emulator-test:
    name: Headless emulator test (Play!)
    needs: build-headless
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Download headless ELF
        uses: actions/download-artifact@v4
        with:
          name: PS2Ident-headless-${{ github.sha }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            wget unzip xvfb libgl1 libgles2 libopengl0 \
            libegl1 libx11-6 libxext6 libxrender1 \
            libxcb1 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1 \
            libxkbcommon-x11-0 libdbus-1-3 libfontconfig1 \
            libfreetype6 libpulse0 libstdc++6 libasound2t64 || true

      - name: Download Play! emulator (latest master CI build)
        run: |
          set -eu
          # Play! has no GitHub releases; download the latest master build via nightly.link.
          # The artifact is a ZIP containing Play!-<hash>-x86_64.AppImage.
          echo "Downloading Play! Linux AppImage from nightly.link..."
          wget -q \
            "https://nightly.link/jpd002/Play-/workflows/build-linux.yaml/master/Play_Linux_x86_64_AppImage.zip" \
            -O play_linux.zip
          mkdir -p play_emulator
          unzip -q play_linux.zip -d play_emulator

          # Find the AppImage (named Play!-<hash>-x86_64.AppImage)
          PLAY_BIN=$(find play_emulator -type f -name "*.AppImage" | head -1)
          if [ -z "$PLAY_BIN" ]; then
            echo "::error::Could not find Play! AppImage after extraction"
            ls -laR play_emulator
            exit 1
          fi
          chmod +x "$PLAY_BIN"
          echo "PLAY_BIN=$PLAY_BIN" >> "$GITHUB_ENV"
          echo "Play! binary: $PLAY_BIN"

      - name: Run emulator headless test
        run: |
          set -eu
          mkdir -p dump_output
          ELF_PATH="$PWD/PS2Ident.elf"

          # Play! maps host0: to ~/.local/share/Play Data Files/vfs/host/
          HOST_DIR="$HOME/.local/share/Play Data Files/vfs/host"

          echo "=== Starting Play! headless test ==="
          echo "ELF: $ELF_PATH"
          echo "Play! binary: $PLAY_BIN"
          echo "Host output dir: $HOST_DIR"

          # Run Play! under Xvfb virtual display.
          # APPIMAGE_EXTRACT_AND_RUN=1 avoids needing FUSE in the CI container.
          # The --elf flag is required by Play!'s Qt CLI parser to boot an ELF directly.
          # Allow up to 120 seconds; ignore non-zero exit (emulator may not exit cleanly).
          APPIMAGE_EXTRACT_AND_RUN=1 \
            xvfb-run --auto-servernum --server-args="-screen 0 640x480x24" \
              timeout 120 "$PLAY_BIN" --elf "$ELF_PATH" 2>&1 | tee dump_output/emulator_output.log || true

          echo "=== Play! session ended ==="

          # Collect dump files written to host0: (~/.local/share/Play Data Files/vfs/host/)
          if [ -d "$HOST_DIR" ]; then
            find "$HOST_DIR" \( \
              -name "*.txt" -o -name "*.NVM" -o -name "*.BIN" \
              -o -name "*.ROM1" -o -name "*.MEC" \
            \) -exec cp -v {} dump_output/ \; 2>/dev/null || true
          fi

          echo "=== Dump output contents ==="
          ls -lh dump_output/
          echo ""

          # Print captured text files to the job log so errors are visible inline
          for f in dump_output/*.txt dump_output/*.log; do
            [ -f "$f" ] || continue
            echo "--- $f ---"
            cat "$f"
            echo ""
          done

      - name: Upload dump artifacts
        uses: actions/upload-artifact@v4
        with:
          name: emulator-test-dump-${{ github.sha }}
          path: dump_output/
          if-no-files-found: warn
