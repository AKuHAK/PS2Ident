name: Emulator Test (Play!)

on:
  push:
  pull_request:

jobs:
  build-headless:
    name: Build headless ELF
    runs-on: ubuntu-latest
    container: ghcr.io/ps2homebrew/ps2homebrew:main
    permissions:
      contents: read
    steps:
      - name: Install dependencies
        run: |
          set -eu
          if command -v apk >/dev/null 2>&1; then
            apk add --no-cache build-base git zip
          elif command -v apt-get >/dev/null 2>&1; then
            apt-get update
            apt-get install -y --no-install-recommends build-essential git zip
          else
            echo "Unsupported container package manager" >&2
            exit 1
          fi

      - uses: actions/checkout@v6

      - name: Build headless ELF
        run: make HEADLESS=1

      - name: Upload headless ELF artifact
        uses: actions/upload-artifact@v7
        with:
          name: PS2Ident-headless-${{ github.sha }}
          path: PS2Ident.elf

  emulator-test:
    name: Headless emulator test (Play!)
    needs: build-headless
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Download headless ELF
        uses: actions/download-artifact@v7
        with:
          name: PS2Ident-headless-${{ github.sha }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            wget unzip xvfb libgl1 libgles2 libopengl0 \
            libegl1 libx11-6 libxext6 libxrender1 \
            libxcb1 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1 \
            libxkbcommon-x11-0 libdbus-1-3 libfontconfig1 \
            libfreetype6 libpulse0 libstdc++6 || true

      - name: Download Play! emulator (latest master CI build)
        run: |
          set -eu
          echo "Downloading Play! Linux AppImage from nightly.link..."
          wget -q \
            "https://nightly.link/jpd002/Play-/workflows/build-linux.yaml/master/Play_Linux_x86_64_AppImage.zip" \
            -O play_linux.zip
          mkdir -p play_emulator
          unzip -q play_linux.zip -d play_emulator

          PLAY_BIN=$(find play_emulator -type f -name "*.AppImage" | head -1)
          if [ -z "$PLAY_BIN" ]; then
            echo "::error::Could not find Play! AppImage after extraction"
            exit 1
          fi
          chmod +x "$PLAY_BIN"
          echo "PLAY_BIN=$PLAY_BIN" >> "$GITHUB_ENV"

      - name: Run emulator headless test
        run: |
          set -eu
          mkdir -p dump_output
          ELF_PATH="$PWD/PS2Ident.elf"
          
          # Default Play! directory on Linux
          PLAY_DATA_DIR="$HOME/.local/share/Play Data Files"
          HOST_DIR="$PLAY_DATA_DIR/vfs/host"
          
          echo "=== 1. Creating directories ==="
          mkdir -p "$HOST_DIR"
          mkdir -p "$PLAY_DATA_DIR/logs"

          echo "=== 2. Generating Play! Config.xml ==="
          # Disabling audio output to fix ALSA missing card crash
          # Enabling stdlogging to catch printf output
          cat << 'EOF' > "$PLAY_DATA_DIR/config.xml"
          <?xml version="1.0" encoding="UTF-8"?>
          <Config>
              <Preference Name="audio.enableoutput" Type="boolean" Value="false" />
              <Preference Name="iop.fileio.stdlogging" Type="boolean" Value="true" />
              <Preference Name="log.showprints" Type="boolean" Value="true" />
          </Config>
          EOF
          
          echo "Config.xml generated at: $PLAY_DATA_DIR/Config.xml"

          echo "=== 3. Starting Play! (headless) ==="
          set +e
          APPIMAGE_EXTRACT_AND_RUN=1 \
            xvfb-run --auto-servernum --server-args="-screen 0 640x480x24" \
              timeout 120 "$PLAY_BIN" --elf "$ELF_PATH" > dump_output/emulator_output.log 2>&1
          EMU_EXIT=$?
          set -e
          
          echo "Emulator exit code: $EMU_EXIT"
          
          if [ $EMU_EXIT -ne 0 ] && [ $EMU_EXIT -ne 124 ]; then
            echo "::error::Play! exited with unexpected code $EMU_EXIT"
            exit $EMU_EXIT
          fi

          echo "=== Play! session ended ==="

          echo "=== 4. Collecting logs and dumps ==="
          if [ -f "$PLAY_DATA_DIR/ps2_stdout.txt" ]; then
            cp -v "$PLAY_DATA_DIR/ps2_stdout.txt" dump_output/
          fi
          
          if [ -f "$PLAY_DATA_DIR/ps2_stderr.txt" ]; then
            cp -v "$PLAY_DATA_DIR/ps2_stderr.txt" dump_output/
          fi
          
          if [ -d "$PLAY_DATA_DIR/logs" ]; then
            cp -rv "$PLAY_DATA_DIR/logs" dump_output/play_logs || true
          fi

          if [ -d "$HOST_DIR" ]; then
            find "$HOST_DIR" -type f -exec cp -v {} dump_output/ \; 2>/dev/null || true
          fi

          echo "=== Dump Directory Contents ==="
          ls -lh dump_output/
          echo ""

          echo "=== APP STDOUT (ps2_stdout.txt) ==="
          if [ -f "dump_output/ps2_stdout.txt" ]; then
            cat "dump_output/ps2_stdout.txt"
          else
            echo "[Empty / File not created]"
          fi
          echo ""

          echo "=== APP STDERR (ps2_stderr.txt) ==="
          if [ -f "dump_output/ps2_stderr.txt" ]; then
            cat "dump_output/ps2_stderr.txt"
          else
            echo "[Empty / File not created]"
          fi

      - name: Upload dump artifacts
        uses: actions/upload-artifact@v7
        with:
          name: emulator-test-dump-${{ github.sha }}
          path: dump_output/
          if-no-files-found: warn
